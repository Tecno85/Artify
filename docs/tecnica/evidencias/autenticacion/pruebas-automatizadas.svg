<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Evidencia de pruebas automatizadas</title>
  <desc id="desc">Representación visual sanitizada del resultado actual de las pruebas automatizadas de Artify.</desc>
  <rect width="1100" height="620" fill="#f6f8fb"/>
  <rect x="70" y="58" width="960" height="504" rx="8" fill="#ffffff" stroke="#d8dee8"/>
  <rect x="70" y="58" width="960" height="64" rx="8" fill="#172033"/>
  <text x="110" y="98" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff">Artify - Evidencia automatizada</text>
  <text x="110" y="162" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033">Resultado de pruebas automatizadas</text>
  <text x="110" y="200" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4a5568">Comandos ejecutados desde backend: pnpm test, test:frontend y test:e2e.</text>
  <rect x="110" y="242" width="880" height="216" rx="8" fill="#111827"/>
  <text x="142" y="292" font-family="Menlo, Consolas, monospace" font-size="16" fill="#d1d5db">backend 65/65</text>
  <text x="142" y="326" font-family="Menlo, Consolas, monospace" font-size="16" fill="#86efac">frontend 44/44</text>
  <text x="142" y="360" font-family="Menlo, Consolas, monospace" font-size="16" fill="#fca5a5">fail 0</text>
  <text x="142" y="394" font-family="Menlo, Consolas, monospace" font-size="16" fill="#d1d5db">e2e 7/7    total 116</text>
  <text x="142" y="428" font-family="Menlo, Consolas, monospace" font-size="16" fill="#93c5fd">Resultado: seguridad y flujos principales aprobados.</text>
  <rect x="110" y="490" width="880" height="58" rx="8" fill="#f4f7fb" stroke="#d8dee8"/>
  <text x="142" y="526" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#4a5568">Evidencia complementaria de las suites backend, frontend y E2E.</text>
</svg>
