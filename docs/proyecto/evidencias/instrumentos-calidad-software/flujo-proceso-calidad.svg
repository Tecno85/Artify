<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc">
  <title id="title">Flujo del proceso de calidad</title>
  <desc id="desc">Siete etapas conectadas desde la planificación hasta la mejora.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#111111"/></marker></defs>
  <rect width="1000" height="500" fill="#ffffff"/>
  <g fill="none" stroke="#111111" stroke-width="2" marker-end="url(#arrow)">
    <path d="M240 145 H285"/><path d="M465 145 H510"/><path d="M690 145 H735"/>
    <path d="M825 195 L690 315"/><path d="M600 340 H555"/><path d="M375 340 H330"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#111111" font-size="22" font-weight="700">
    <g fill="#dce6f2" stroke="#111111" stroke-width="2">
      <rect x="60" y="95" width="180" height="100"/><rect x="285" y="95" width="180" height="100"/>
      <rect x="510" y="95" width="180" height="100"/><rect x="735" y="95" width="180" height="100"/>
    </g>
    <g fill="#eef3f8" stroke="#111111" stroke-width="2">
      <rect x="600" y="290" width="180" height="100"/><rect x="375" y="290" width="180" height="100"/><rect x="150" y="290" width="180" height="100"/>
    </g>
    <text x="150" y="152">1. Planificar</text><text x="375" y="152">2. Definir</text>
    <text x="600" y="152">3. Construir</text><text x="825" y="152">4. Probar</text>
    <text x="690" y="347">5. Corregir</text><text x="465" y="347">6. Validar</text><text x="240" y="347">7. Mejorar</text>
  </g>
  <text x="500" y="455" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic">Cada hallazgo conserva evidencia y retroalimenta la etapa correspondiente.</text>
</svg>
