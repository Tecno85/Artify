<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-labelledby="title desc">
  <title id="title">Cadena de trazabilidad de la calidad</title>
  <desc id="desc">Cadena que conecta requisito, criterio, prueba, defecto, corrección y evidencia para conservar trazabilidad del cambio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="1" stop-color="#eef5f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#071d33" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1598a6"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #071d33; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #405164; }
      .label { font: 700 20px Arial, sans-serif; fill: #071d33; }
      .desc { font: 400 15px Arial, sans-serif; fill: #405164; }
      .tag { font: 700 13px Arial, sans-serif; fill: #1598a6; }
      .card { fill: #ffffff; stroke: #c7d9df; stroke-width: 1.3; rx: 16; filter: url(#shadow); }
      .line { fill: none; stroke: #1598a6; stroke-width: 3; marker-end: url(#arrow); stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1100" height="470" fill="url(#bg)"/>
  <text x="70" y="68" class="title">Cadena de trazabilidad de la calidad</text>
  <text x="70" y="99" class="subtitle">Cada registro conserva una relación verificable entre necesidad, control, resultado y evidencia.</text>

  <path class="line" d="M190 244 H236"/>
  <path class="line" d="M348 244 H394"/>
  <path class="line" d="M506 244 H552"/>
  <path class="line" d="M664 244 H710"/>
  <path class="line" d="M822 244 H868"/>

  <g text-anchor="middle">
    <rect class="card" x="58" y="178" width="132" height="132"/>
    <circle cx="124" cy="162" r="28" fill="#1598a6"/>
    <text x="124" y="169" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">RF</text>
    <text x="124" y="226" class="label">Requisito</text>
    <text x="124" y="255" class="desc">Necesidad</text>
    <text x="124" y="276" class="desc">funcional</text>

    <rect class="card" x="236" y="178" width="132" height="132"/>
    <circle cx="302" cy="162" r="28" fill="#071d33"/>
    <text x="302" y="169" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">CA</text>
    <text x="302" y="226" class="label">Criterio</text>
    <text x="302" y="255" class="desc">Condición</text>
    <text x="302" y="276" class="desc">de aceptación</text>

    <rect class="card" x="394" y="178" width="132" height="132"/>
    <circle cx="460" cy="162" r="28" fill="#1598a6"/>
    <text x="460" y="169" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">TP</text>
    <text x="460" y="226" class="label">Prueba</text>
    <text x="460" y="255" class="desc">Caso o suite</text>
    <text x="460" y="276" class="desc">ejecutada</text>

    <rect class="card" x="552" y="178" width="132" height="132"/>
    <circle cx="618" cy="162" r="28" fill="#e86d6d"/>
    <text x="618" y="169" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">DF</text>
    <text x="618" y="226" class="label">Defecto</text>
    <text x="618" y="255" class="desc">Hallazgo</text>
    <text x="618" y="276" class="desc">registrado</text>

    <rect class="card" x="710" y="178" width="132" height="132"/>
    <circle cx="776" cy="162" r="28" fill="#f2b705"/>
    <text x="776" y="169" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">AC</text>
    <text x="776" y="226" class="label">Corrección</text>
    <text x="776" y="255" class="desc">Cambio</text>
    <text x="776" y="276" class="desc">aplicado</text>

    <rect class="card" x="868" y="178" width="174" height="132"/>
    <circle cx="955" cy="162" r="28" fill="#1598a6"/>
    <text x="955" y="169" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#ffffff">EV</text>
    <text x="955" y="226" class="label">Evidencia</text>
    <text x="955" y="255" class="desc">Commit, prueba</text>
    <text x="955" y="276" class="desc">o documento</text>
  </g>

  <rect x="185" y="368" width="730" height="48" rx="24" fill="#ffffff" stroke="#c7d9df" stroke-width="1.3"/>
  <text x="550" y="399" text-anchor="middle" class="tag">Un identificador estable permite seguir la historia completa del cambio.</text>
</svg>
