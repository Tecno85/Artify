<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de referentes de calidad aplicados a Artify</title>
  <desc id="desc">Mapa visual que relaciona ISO 25010, ISO 12207, PSP, OWASP, Scrum y CMMI con la calidad del proyecto Artify.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="1" stop-color="#edf4f7"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28ffce"/>
      <stop offset="1" stop-color="#1694a3"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#082033" flood-opacity="0.14"/>
    </filter>
    <marker id="dotArrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1694a3"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #071d33; }
      .label { font: 700 23px Arial, sans-serif; fill: #071d33; }
      .small { font: 400 17px Arial, sans-serif; fill: #405164; }
      .eyebrow { font: 700 13px Arial, sans-serif; letter-spacing: 1.5px; fill: #1694a3; }
      .line { fill: none; stroke: #1694a3; stroke-width: 3; stroke-linecap: round; marker-end: url(#dotArrow); opacity: 0.9; }
      .card { fill: #ffffff; stroke: #c8d8df; stroke-width: 1.4; rx: 18; filter: url(#softShadow); }
    </style>
  </defs>

  <rect width="1100" height="620" fill="url(#bg)"/>
  <rect x="46" y="44" width="1008" height="532" rx="30" fill="#ffffff" opacity="0.82"/>
  <text x="76" y="92" class="eyebrow">REFERENTES DE CALIDAD</text>
  <text x="76" y="128" class="title">Relación de buenas prácticas aplicadas en Artify</text>

  <path class="line" d="M550 322 C430 286 340 246 270 204"/>
  <path class="line" d="M550 322 C675 284 760 244 830 204"/>
  <path class="line" d="M550 322 C425 344 335 390 270 456"/>
  <path class="line" d="M550 322 C680 344 760 390 830 456"/>
  <path class="line" d="M550 322 C550 402 550 450 550 498"/>

  <g filter="url(#softShadow)">
    <circle cx="550" cy="322" r="92" fill="url(#core)"/>
    <circle cx="550" cy="322" r="72" fill="#ffffff" opacity="0.18"/>
  </g>
  <text x="550" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#06192c">CALIDAD</text>
  <text x="550" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#06192c">Artify</text>

  <g text-anchor="middle">
    <rect class="card" x="122" y="154" width="270" height="118"/>
    <text x="257" y="198" class="label">ISO 25010</text>
    <text x="257" y="229" class="small">Calidad del producto</text>
    <text x="257" y="252" class="small">funcionalidad y seguridad</text>

    <rect class="card" x="708" y="154" width="270" height="118"/>
    <text x="843" y="198" class="label">ISO 12207</text>
    <text x="843" y="229" class="small">Ciclo de vida</text>
    <text x="843" y="252" class="small">procesos y documentación</text>

    <rect class="card" x="122" y="386" width="270" height="118"/>
    <text x="257" y="430" class="label">PSP</text>
    <text x="257" y="461" class="small">Registro personal</text>
    <text x="257" y="484" class="small">defectos y aprendizaje</text>

    <rect class="card" x="708" y="386" width="270" height="118"/>
    <text x="843" y="430" class="label">OWASP</text>
    <text x="843" y="461" class="small">Riesgos web</text>
    <text x="843" y="484" class="small">validación y autorización</text>

    <rect class="card" x="398" y="486" width="304" height="88"/>
    <text x="550" y="523" class="label">Scrum y CMMI</text>
    <text x="550" y="552" class="small">inspección, adaptación y mejora</text>
  </g>
</svg>
