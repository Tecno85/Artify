<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Aplicación de los instrumentos en Artify</title>
  <desc id="desc">Aplicación de los instrumentos de calidad en el flujo de carga de imágenes de Artify.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbfb"/>
      <stop offset="1" stop-color="#edf5f8"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2440"/>
      <stop offset="1" stop-color="#0f5f6a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#071d33" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#1598a6"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #071d33; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #405164; }
      .label { font: 700 18px Arial, sans-serif; fill: #071d33; }
      .desc { font: 400 14px Arial, sans-serif; fill: #405164; }
      .mini { font: 700 12px Arial, sans-serif; fill: #1598a6; }
      .card { fill: #ffffff; stroke: #c7d9df; stroke-width: 1.3; rx: 16; filter: url(#shadow); }
      .line { fill: none; stroke: #1598a6; stroke-width: 3; marker-end: url(#arrow); stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1100" height="520" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Aplicación de los instrumentos en Artify</text>
  <text x="70" y="101" class="subtitle">Ejemplo aplicado al flujo de carga de imágenes del editor.</text>

  <rect x="70" y="142" width="335" height="235" rx="24" fill="url(#screen)" filter="url(#shadow)"/>
  <rect x="95" y="170" width="285" height="172" rx="16" fill="#f7fbfb"/>
  <rect x="120" y="197" width="128" height="94" rx="12" fill="#d9eef1" stroke="#8ecbd1" stroke-width="1.2"/>
  <path d="M140 270 L173 236 L198 259 L215 240 L235 270 Z" fill="#1598a6" opacity="0.78"/>
  <circle cx="219" cy="222" r="12" fill="#f2b705"/>
  <rect x="270" y="199" width="84" height="12" rx="6" fill="#1598a6"/>
  <rect x="270" y="225" width="74" height="9" rx="4.5" fill="#9fb3bf"/>
  <rect x="270" y="247" width="92" height="9" rx="4.5" fill="#9fb3bf"/>
  <rect x="270" y="271" width="62" height="26" rx="13" fill="#071d33"/>
  <text x="301" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Validar</text>
  <text x="238" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Carga controlada en el editor Canvas</text>

  <path class="line" d="M430 250 H485"/>
  <path class="line" d="M655 250 H710"/>

  <g>
    <rect class="card" x="485" y="142" width="170" height="108"/>
    <text x="510" y="173" class="mini">01 REQUISITO</text>
    <text x="510" y="203" class="label">RF-05</text>
    <text x="510" y="228" class="desc">Formatos admitidos</text>

    <rect class="card" x="485" y="276" width="170" height="108"/>
    <text x="510" y="307" class="mini">02 CONTROL</text>
    <text x="510" y="337" class="label">Validación</text>
    <text x="510" y="362" class="desc">Tamaño, tipo y límite</text>

    <rect class="card" x="710" y="142" width="170" height="108"/>
    <text x="735" y="173" class="mini">03 EJECUCIÓN</text>
    <text x="735" y="203" class="label">Canvas</text>
    <text x="735" y="228" class="desc">Vista y herramientas</text>

    <rect class="card" x="710" y="276" width="170" height="108"/>
    <text x="735" y="307" class="mini">04 PRUEBA</text>
    <text x="735" y="337" class="label">Aceptación</text>
    <text x="735" y="362" class="desc">Casos verificables</text>
  </g>

  <rect x="920" y="183" width="120" height="160" rx="18" fill="#ffffff" stroke="#c7d9df" stroke-width="1.3" filter="url(#shadow)"/>
  <circle cx="980" cy="223" r="28" fill="#28ffce"/>
  <path d="M966 224 L976 234 L996 211" fill="none" stroke="#071d33" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="980" y="280" text-anchor="middle" class="label">Evidencia</text>
  <text x="980" y="306" text-anchor="middle" class="desc">Resultado,</text>
  <text x="980" y="326" text-anchor="middle" class="desc">defecto y PSP</text>

  <path class="line" d="M880 250 H920"/>
  <path class="line" d="M570 250 V276"/>
  <path class="line" d="M655 330 H710"/>

  <rect x="145" y="416" width="810" height="58" rx="29" fill="#071d33"/>
  <text x="550" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Los instrumentos convierten el requisito de carga de imágenes</text>
  <text x="550" y="461" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">en controles, pruebas y evidencia verificable.</text>
</svg>
