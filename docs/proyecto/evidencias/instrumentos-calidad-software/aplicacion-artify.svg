<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Aplicación de los instrumentos en Artify</title>
  <desc id="desc">La carga de imágenes pasa por requisito, validación, Canvas, pruebas y evidencia.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><path d="M0,0 L10,3.5 L0,7 Z" fill="#111111"/></marker></defs>
  <rect width="1000" height="440" fill="#ffffff"/>
  <rect x="25" y="45" width="950" height="330" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <g stroke="#111111" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M205 210 H220"/><path d="M390 210 H405"/><path d="M575 210 H590"/><path d="M760 210 H775"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" text-anchor="middle" fill="#111111">
    <g stroke="#111111" stroke-width="2">
      <rect x="35" y="155" width="170" height="110" fill="#dce6f2"/><rect x="220" y="155" width="170" height="110" fill="#eef3f8"/>
      <rect x="405" y="155" width="170" height="110" fill="#dce6f2"/><rect x="590" y="155" width="170" height="110" fill="#eef3f8"/>
      <rect x="775" y="155" width="190" height="110" fill="#dce6f2"/>
    </g>
    <g font-size="22" font-weight="700">
      <text x="120" y="202">RF-05</text><text x="305" y="202">Validación</text><text x="490" y="202">Canvas</text><text x="675" y="202">Pruebas</text><text x="870" y="202">Evidencia</text>
    </g>
    <g font-size="18">
      <text x="120" y="234">Formatos admitidos</text><text x="305" y="234">Límites del archivo</text><text x="490" y="234">Vista y herramientas</text><text x="675" y="234">Casos de aceptación</text><text x="870" y="234">Resultado y PSP</text>
    </g>
    <text x="500" y="335" font-size="20" font-style="italic">Aplicación coordinada de los instrumentos en la carga de imágenes de Artify.</text>
  </g>
</svg>
